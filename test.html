
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocky 3D Character</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202727;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden}
#hud{position:absolute;inset:0;pointer-events:none;color:white}
#help{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:12px 16px;border-radius:10px;background:#111c;font-size:12px;letter-spacing:.7px;text-align:center;width:max-content;max-width:92vw;box-sizing:border-box}
#status{position:absolute;left:16px;bottom:16px;padding:10px 13px;border-radius:8px;background:#111b;font-size:12px}
#crosshair{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;opacity:.8}
canvas{display:block;width:100%;height:100%;outline:none}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="help">CLICK TO PLAY · WASD MOVE · SHIFT SPRINT · SPACE JUMP · ESC UNLOCK</div>
    <div id="crosshair">+</div>
    <div id="status">CLICK TO PLAY</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(() => {
  const container = document.getElementById('game');
  const help = document.getElementById('help');
  const status = document.getElementById('status');
  const crosshair = document.getElementById('crosshair');

  if (!window.THREE) {
    help.textContent = 'Three.js failed to load. Check your internet connection.';
    return;
  }

  const THREE = window.THREE;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202727);
  scene.fog = new THREE.Fog(0x202727, 28, 100);

  const camera = new THREE.PerspectiveCamera(
    70, innerWidth / innerHeight, 0.1, 200
  );

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.insertBefore(renderer.domElement, container.firstChild);

  scene.add(new THREE.HemisphereLight(0xdce5ff, 0x49434b, 1.7));

  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-12,24,10);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.left = -35;
  sun.shadow.camera.right = 35;
  sun.shadow.camera.top = 35;
  sun.shadow.camera.bottom = -35;
  scene.add(sun);

  const mat = color => new THREE.MeshStandardMaterial({
    color, roughness:0.85
  });

  const white = mat(0xe5e5e5);
  const headMat = mat(0xeeeeee);
  const black = mat(0x111111);
  const groundMat = mat(0x454249);
  const buildingMats = [
    mat(0x35363e),mat(0x41424b),
    mat(0x2a2b32),mat(0x4a4b53)
  ];

  function block(parent,w,h,d,material,x,y,z) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),material
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),groundMat
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.04;
  ground.receiveShadow = true;
  scene.add(ground);

  // Dark blocky city
  let seed = 124;
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed-1)/2147483646;
  }

  for(let i=0;i<100;i++) {
    const side = rand()<0.5 ? -1 : 1;
    const x = side*(8+rand()*28);
    const z = (rand()-0.5)*85;
    const w = 2+rand()*5;
    const h = 4+rand()*16;
    const d = 2+rand()*5;

    block(scene,w,h,d,
      buildingMats[Math.floor(rand()*buildingMats.length)],
      x,h/2,z
    );
  }

  // Character
  const player = new THREE.Group();
  scene.add(player);

  const rig = new THREE.Group();
  player.add(rig);

  // Torso
  block(rig,1.25,1.35,0.62,white,0,1.95,0);

  // Head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.85,0.9,0.78),headMat
  );
  head.position.set(0,3.12,0);
  head.castShadow = true;
  rig.add(head);

  // Simple smiling face
  function facePart(w,h,d,material,x,y,z) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),material
    );
    m.position.set(x,y,z);
    rig.add(m);
  }

  facePart(0.055,0.14,0.025,black,-0.17,3.19,-0.402);
  facePart(0.055,0.14,0.025,black,0.02,3.19,-0.402);

  const smileCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.17,3.00,-0.415),
    new THREE.Vector3(0,2.82,-0.425),
    new THREE.Vector3(0.18,3.00,-0.415)
  );

  rig.add(new THREE.Mesh(
    new THREE.TubeGeometry(smileCurve,16,0.022,6,false),
    black
  ));

  // Pivoted limbs for walking animation
  function makeLimb(x,y,w,h,d) {
    const pivot = new THREE.Group();
    pivot.position.set(x,y,0);
    rig.add(pivot);
    block(pivot,w,h,d,white,0,-h/2,0);
    return pivot;
  }

  const leftArm  = makeLimb(-0.78,2.48,0.42,1.25,0.48);
  const rightArm = makeLimb(0.78,2.48,0.42,1.25,0.48);
  const leftLeg  = makeLimb(-0.32,1.27,0.59,1.25,0.58);
  const rightLeg = makeLimb(0.32,1.27,0.59,1.25,0.58);

  const keys = Object.create(null);
  let yaw = 0;
  let pitch = -0.12;
  let verticalSpeed = 0;
  let grounded = true;
  let walkTime = 0;
  let locked = false;

  const clock = new THREE.Clock();
  const direction = new THREE.Vector3();

  // Mouse lock
  function requestLock() {
    renderer.domElement.requestPointerLock();
  }

  renderer.domElement.addEventListener('click',requestLock);

  function onLockChange() {
    locked = document.pointerLockElement === renderer.domElement;
    crosshair.style.display = locked ? 'block' : 'none';
    help.style.display = locked ? 'none' : 'block';
    status.textContent = locked ? 'IN GAME' : 'CLICK TO PLAY';
  }

  function onMouseMove(e) {
    if(!locked) return;
    yaw -= e.movementX*0.0025;
    pitch -= e.movementY*0.002;
    pitch = THREE.MathUtils.clamp(pitch,-0.75,0.48);
  }

  function onKeyDown(e) {
    if([
      'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'
    ].includes(e.code)) e.preventDefault();

    keys[e.code] = true;

    if(e.code==='Space' && grounded) {
      verticalSpeed = 8.5;
      grounded = false;
    }
  }

  function onKeyUp(e) {
    keys[e.code] = false;
  }

  function onBlur() {
    Object.keys(keys).forEach(k=>keys[k]=false);
  }

  document.addEventListener('pointerlockchange',onLockChange);
  document.addEventListener('mousemove',onMouseMove);
  window.addEventListener('keydown',onKeyDown);
  window.addEventListener('keyup',onKeyUp);
  window.addEventListener('blur',onBlur);

  function damp(current,target,lambda,dt) {
    return THREE.MathUtils.lerp(
      current,target,1-Math.exp(-lambda*dt)
    );
  }

  function update(dt) {
    const forward = new THREE.Vector3(
      -Math.sin(yaw),0,-Math.cos(yaw)
    );

    const right = new THREE.Vector3(
      Math.cos(yaw),0,-Math.sin(yaw)
    );

    direction.set(0,0,0);

    if(keys.KeyW || keys.ArrowUp) direction.add(forward);
    if(keys.KeyS || keys.ArrowDown) direction.sub(forward);
    if(keys.KeyD || keys.ArrowRight) direction.add(right);
    if(keys.KeyA || keys.ArrowLeft) direction.sub(right);

    const moving = direction.lengthSq()>0;
    const sprinting = !!keys.ShiftLeft || !!keys.ShiftRight;

    if(moving) {
      direction.normalize();
      player.position.addScaledVector(
        direction,(sprinting?9:5)*dt
      );

      player.rotation.y = Math.atan2(
        -direction.x,-direction.z
      );
    }

    // Gravity and jump
    verticalSpeed -= 22*dt;
    player.position.y += verticalSpeed*dt;

    if(player.position.y<=0) {
      player.position.y = 0;
      verticalSpeed = 0;
      grounded = true;
    }

    // Walking animation
    if(moving && grounded) {
      walkTime += dt*(sprinting?13:9);
      const swing = Math.sin(walkTime)*(sprinting?0.75:0.48);

      leftLeg.rotation.x = swing;
      rightLeg.rotation.x = -swing;
      leftArm.rotation.x = -swing*0.8;
      rightArm.rotation.x = swing*0.8;

      rig.position.y = Math.abs(Math.sin(walkTime*2))*0.045;
    } else {
      leftLeg.rotation.x = damp(leftLeg.rotation.x,0,10,dt);
      rightLeg.rotation.x = damp(rightLeg.rotation.x,0,10,dt);
      leftArm.rotation.x = damp(leftArm.rotation.x,0,10,dt);
      rightArm.rotation.x = damp(rightArm.rotation.x,0,10,dt);
      rig.position.y = damp(rig.position.y,0,10,dt);
    }

    // Third-person follow camera
    const distance = 7;
    const horizontal = Math.cos(pitch)*distance;

    const desiredCamera = new THREE.Vector3(
      player.position.x+Math.sin(yaw)*horizontal,
      player.position.y+3+Math.sin(-pitch)*distance,
      player.position.z+Math.cos(yaw)*horizontal
    );

    camera.position.lerp(
      desiredCamera,1-Math.exp(-8*dt)
    );

    camera.lookAt(
      player.position.x,
      player.position.y+2,
      player.position.z
    );
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(),0.033);
    update(dt);
    renderer.render(scene,camera);
  }

  function onResize() {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }

  window.addEventListener('resize',onResize);
  animate();
})();
</script>
</body>
</html>
