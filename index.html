<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>CiphAnon Safe Browser</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#101010;
    --panel:#171717;
    --panel2:#1d1d1d;
    --line:#303030;
    --text:#f2f2f2;
    --muted:#858585;
    --white:#fff;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    position:relative;
}

/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.bg::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 45%,
            #242424 0%,
            #151515 35%,
            #0d0d0d 75%
        );
}

.grid{
    position:absolute;
    inset:-20%;
    opacity:.16;

    background-image:
        linear-gradient(#fff 1px,transparent 1px),
        linear-gradient(90deg,#fff 1px,transparent 1px);

    background-size:70px 70px;

    transform:
        perspective(500px)
        rotateX(62deg)
        translateY(20%);

    transform-origin:center;
}

.noise{
    position:absolute;
    inset:0;
    opacity:.035;

    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* =========================
   CENTER
========================= */

.center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(
        700px,
        calc(100% - 40px)
    );

    z-index:500;

    pointer-events:none;
}

.hero{
    text-align:center;
    margin-bottom:24px;
}

.hero h1{
    font-size:clamp(
        30px,
        5vw,
        52px
    );

    letter-spacing:-2.5px;
    line-height:1;
    font-weight:800;
}

.hero p{
    margin-top:10px;
    color:#777;
    font-size:12px;
    letter-spacing:.4px;
}

/* =========================
   SEARCH
========================= */

.search{
    height:62px;
    width:100%;

    border-radius:20px;
    border:1px solid #383838;

    background:#191919e8;

    backdrop-filter:blur(22px);

    display:flex;
    align-items:center;

    padding:7px;

    box-shadow:
        0 25px 70px #0009,
        inset 0 1px 0 #ffffff12;

    pointer-events:auto;

    transition:.25s ease;
}

.search:focus-within{
    border-color:#555;

    box-shadow:
        0 25px 80px #000,
        0 0 0 3px #ffffff08,
        inset 0 1px 0 #ffffff18;
}

.searchIcon{
    width:45px;

    display:grid;
    place-items:center;

    color:#777;
    font-size:19px;
}

.search input{
    flex:1;
    height:100%;

    border:0;
    outline:0;

    background:transparent;
    color:#eee;

    font-size:14px;

    min-width:0;
}

.search input::placeholder{
    color:#666;
}

.go{
    height:48px;

    padding:0 20px;

    border:1px solid #444;
    border-radius:15px;

    background:#303030;
    color:#eee;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.go:hover{
    background:#3b3b3b;
    transform:translateY(-1px);
}

/* =========================
   PHYSICS WORLD
========================= */

.world{
    position:fixed;
    inset:0;

    z-index:100;

    pointer-events:none;
}

/* =========================
   BLOCKS
========================= */

.block{
    position:absolute;

    width:148px;
    height:148px;

    border-radius:27px;

    padding:8px;

    background:
        linear-gradient(
            145deg,
            #343434,
            #1b1b1b
        );

    border:1px solid #444;

    box-shadow:
        0 18px 40px #0009,
        inset 0 1px 0 #ffffff16;

    transform-origin:center;

    user-select:none;
    touch-action:none;

    cursor:grab;

    pointer-events:auto;

    will-change:transform;
}

.block::before{
    content:"";

    position:absolute;

    inset:7px;

    border-radius:20px;

    border:1px solid #ffffff0b;

    pointer-events:none;
}

.block.dragging{
    cursor:grabbing;

    z-index:900;

    box-shadow:
        0 25px 65px #000,
        0 0 0 2px #ffffff12,
        inset 0 1px 0 #ffffff20;
}

.block img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:20px;

    filter:
        grayscale(1)
        contrast(.9);

    opacity:.8;

    pointer-events:none;
}

.blockLabel{
    position:absolute;

    left:16px;
    bottom:15px;
    right:16px;

    padding:7px 9px;

    border-radius:9px;

    background:#090909aa;

    border:1px solid #ffffff0c;

    backdrop-filter:blur(10px);

    color:#eee;

    font-size:9px;

    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;

    text-align:center;

    pointer-events:none;
}

/* =========================
   BROWSER OVERLAY
========================= */

.browser{
    position:fixed;

    inset:14px;

    z-index:5000;

    background:#111;

    border:1px solid #383838;

    border-radius:22px;

    box-shadow:
        0 35px 100px #000;

    overflow:hidden;

    display:none;

    flex-direction:column;
}

.browser.open{
    display:flex;

    animation:
        browserIn .25s ease;
}

@keyframes browserIn{

    from{
        opacity:0;
        transform:scale(.97);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.browserBar{
    height:58px;

    flex-shrink:0;

    display:flex;
    align-items:center;

    gap:8px;

    padding:7px 9px;

    background:#181818;

    border-bottom:1px solid #2d2d2d;
}

.browserButton{
    width:40px;
    height:40px;

    border-radius:12px;

    border:1px solid #333;

    background:#222;

    color:#aaa;

    cursor:pointer;
}

.browserButton:hover{
    background:#2b2b2b;
    color:white;
}

.browserAddress{
    flex:1;

    height:40px;

    border-radius:12px;

    border:1px solid #333;

    background:#101010;

    color:#aaa;

    padding:0 14px;

    font-size:12px;

    outline:none;
}

.browser iframe{
    width:100%;
    height:100%;

    border:0;

    background:white;
}

/* =========================
   FOOTER
========================= */

.hint{
    position:fixed;

    bottom:19px;
    left:50%;

    transform:translateX(-50%);

    z-index:600;

    color:#555;

    font-size:9px;

    letter-spacing:1.3px;

    text-transform:uppercase;

    pointer-events:none;

    white-space:nowrap;
}

kbd{
    display:inline-block;

    margin:0 3px;

    padding:3px 6px;

    border-radius:5px;

    border:1px solid #303030;

    background:#191919;

    color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .center{
        width:calc(100% - 28px);
    }

    .hero{
        margin-bottom:16px;
    }

    .hero h1{
        font-size:34px;
    }

    .search{
        height:55px;
        border-radius:17px;
    }

    .go{
        height:43px;
        padding:0 14px;
        border-radius:12px;
    }

    .block{
        width:116px;
        height:116px;

        border-radius:23px;

        padding:7px;
    }

    .block img{
        border-radius:17px;
    }

    .hint{
        bottom:10px;
        font-size:7px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="grid"></div>
    <div class="noise"></div>
</div>

<!-- CENTER -->

<div class="center">

    <div class="hero">

        <h1>Where to?</h1>

        <p>
            Search the web or open one of your spaces.
        </p>

    </div>

    <form
        class="search"
        id="searchForm"
    >

        <div class="searchIcon">
            ⌕
        </div>

        <input
            id="searchInput"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search or enter a website..."
        >

        <button
            class="go"
            type="submit"
        >
            Go
        </button>

    </form>

</div>


<!-- PHYSICS -->

<div
    class="world"
    id="world"
>

    <div
        class="block"
        data-url="games.html"
        data-name="Games"
    >

        <img src="images/games.jpg">

        <div class="blockLabel">
            Games
        </div>

    </div>


    <div
        class="block"
        data-url="movies.html"
        data-name="Movies"
    >

        <img src="images/movies.jpg">

        <div class="blockLabel">
            Movies
        </div>

    </div>


    <div
        class="block"
        data-url="roblox.html"
        data-name="Roblox"
    >

        <img src="images/roblox.jpg">

        <div class="blockLabel">
            Roblox
        </div>

    </div>


    <div
        class="block"
        data-url="index.html"
        data-name="Home"
    >

        <img src="images/home.jpg">

        <div class="blockLabel">
            Home
        </div>

    </div>

</div>


<div class="hint">
    Drag blocks ·
    <kbd>ESC</kbd>
    close browser
</div>


<!-- BROWSER -->

<div
    class="browser"
    id="browser"
>

    <div class="browserBar">

        <button
            class="browserButton"
            id="closeBrowser"
        >
            ✕
        </button>

        <button
            class="browserButton"
            id="backButton"
        >
            ←
        </button>

        <button
            class="browserButton"
            id="forwardButton"
        >
            →
        </button>

        <input
            class="browserAddress"
            id="browserAddress"
            readonly
        >

    </div>

    <iframe
        id="browserFrame"
        title="CiphAnon Browser"
    ></iframe>

</div>


<script>

/* ============================================================
   CIPHANON SAFE BROWSER
   SOLID ROUNDED-BLOCK PHYSICS
============================================================ */

const world =
    document.getElementById("world");

const blocks =
    [...document.querySelectorAll(".block")];

const browser =
    document.getElementById("browser");

const browserFrame =
    document.getElementById("browserFrame");

const browserAddress =
    document.getElementById("browserAddress");

const searchForm =
    document.getElementById("searchForm");

const searchInput =
    document.getElementById("searchInput");

const closeBrowser =
    document.getElementById("closeBrowser");

const backButton =
    document.getElementById("backButton");

const forwardButton =
    document.getElementById("forwardButton");


/* ============================================================
   PHYSICS SETTINGS
============================================================ */

const PHYSICS = {

    gravity:0,

    air:0.9994,

    angularAir:0.9992,

    restitution:0.82,

    friction:0.018,

    collisionIterations:8,

    positionPercent:0.92,

    minimumSpeed:0.035,

    maxSpeed:1.8,

    maxAngular:0.018,

    cornerSteps:12
};


/* ============================================================
   VECTOR HELPERS
============================================================ */

function sub(a,b){

    return {
        x:a.x-b.x,
        y:a.y-b.y
    };
}

function mul(a,n){

    return {
        x:a.x*n,
        y:a.y*n
    };
}

function dot(a,b){

    return a.x*b.x+a.y*b.y;
}

function length(v){

    return Math.hypot(v.x,v.y);
}

function normalize(v){

    const l=length(v);

    if(l<0.000001){

        return {
            x:1,
            y:0
        };
    }

    return {
        x:v.x/l,
        y:v.y/l
    };
}

function rotatePoint(p,a){

    const c=Math.cos(a);
    const s=Math.sin(a);

    return {
        x:p.x*c-p.y*s,
        y:p.x*s+p.y*c
    };
}


/* ============================================================
   OBJECT SETUP
============================================================ */

const objects=[];

function random(min,max){

    return Math.random()*
        (max-min)+min;
}

function getSize(el){

    return {
        width:el.offsetWidth,
        height:el.offsetHeight
    };
}

function getRadius(el){

    const style=
        getComputedStyle(el);

    let r=
        parseFloat(
            style.borderTopLeftRadius
        );

    if(!Number.isFinite(r)){
        r=0;
    }

    const size=
        getSize(el);

    return Math.min(
        r,
        size.width/2,
        size.height/2
    );
}


/* ============================================================
   CREATE PHYSICS OBJECT
============================================================ */

function createObject(el,index){

    const size=
        getSize(el);

    const obj={

        el,

        x:random(
            30,
            Math.max(
                30,
                innerWidth-
                size.width-
                30
            )
        ),

        y:random(
            30,
            Math.max(
                30,
                innerHeight-
                size.height-
                30
            )
        ),

        width:size.width,

        height:size.height,

        radius:getRadius(el),

        vx:random(
            -0.65,
            0.65
        ),

        vy:random(
            -0.65,
            0.65
        ),

        angle:random(
            -Math.PI,
            Math.PI
        ),

        angularVelocity:random(
            -0.006,
            0.006
        ),

        mass:1,

        dragging:false,

        pointerId:null,

        previousX:0,

        previousY:0,

        moved:false
    };


    if(index===0){

        obj.x=innerWidth*.16;
        obj.y=innerHeight*.24;
    }

    if(index===1){

        obj.x=innerWidth*.68;
        obj.y=innerHeight*.25;
    }

    if(index===2){

        obj.x=innerWidth*.20;
        obj.y=innerHeight*.67;
    }

    if(index===3){

        obj.x=innerWidth*.68;
        obj.y=innerHeight*.68;
    }


    obj.previousX=obj.x;
    obj.previousY=obj.y;

    return obj;
}


blocks.forEach(
    (el,i)=>{

        const obj=
            createObject(
                el,
                i
            );

        objects.push(obj);

        setupDragging(obj);
    }
);


/* ============================================================
   ROUNDED RECTANGLE POLYGON
============================================================ */

function roundedPolygon(obj){

    const w=obj.width;
    const h=obj.height;

    const r=Math.min(
        obj.radius,
        w/2,
        h/2
    );

    const points=[];

    const corners=[

        {
            cx:w/2-r,
            cy:h/2-r,
            start:0
        },

        {
            cx:-w/2+r,
            cy:h/2-r,
            start:Math.PI/2
        },

        {
            cx:-w/2+r,
            cy:-h/2+r,
            start:Math.PI
        },

        {
            cx:w/2-r,
            cy:-h/2+r,
            start:Math.PI*1.5
        }

    ];


    for(const corner of corners){

        for(
            let i=0;
            i<=PHYSICS.cornerSteps;
            i++
        ){

            const t=
                i/
                PHYSICS.cornerSteps;

            const a=
                corner.start+
                t*Math.PI/2;

            const local={

                x:
                    corner.cx+
                    Math.cos(a)*r,

                y:
                    corner.cy+
                    Math.sin(a)*r

            };

            const rotated=
                rotatePoint(
                    local,
                    obj.angle
                );

            points.push({

                x:
                    obj.x+
                    rotated.x,

                y:
                    obj.y+
                    rotated.y

            });
        }
    }

    return points;
}


/* ============================================================
   SAT
============================================================ */

function getAxes(poly){

    const axes=[];

    for(
        let i=0;
        i<poly.length;
        i++
    ){

        const a=poly[i];

        const b=
            poly[
                (i+1)%
                poly.length
            ];

        const edge={

            x:b.x-a.x,

            y:b.y-a.y

        };

        const normal={

            x:-edge.y,

            y:edge.x

        };

        axes.push(
            normalize(normal)
        );
    }

    return axes;
}


function project(poly,axis){

    let min=Infinity;
    let max=-Infinity;

    for(const p of poly){

        const value=
            dot(p,axis);

        if(value<min)
            min=value;

        if(value>max)
            max=value;
    }

    return {
        min,
        max
    };
}


function polygonCollision(
    polyA,
    polyB
){

    const axes=[

        ...getAxes(polyA),

        ...getAxes(polyB)

    ];

    let smallestOverlap=
        Infinity;

    let smallestAxis=null;


    for(const axis of axes){

        const a=
            project(
                polyA,
                axis
            );

        const b=
            project(
                polyB,
                axis
            );

        const overlap=

            Math.min(
                a.max,
                b.max
            )

            -

            Math.max(
                a.min,
                b.min
            );


        if(overlap<=0){

            return null;
        }


        if(
            overlap<
            smallestOverlap
        ){

            smallestOverlap=
                overlap;

            smallestAxis=
                axis;
        }
    }


    return {

        depth:
            smallestOverlap,

        axis:
            smallestAxis

    };
}


/* ============================================================
   COLLISION RESOLUTION
============================================================ */

function resolveCollision(
    a,
    b,
    collision
){

    if(!collision){
        return;
    }


    const centerDirection=
        sub(
            {
                x:b.x,
                y:b.y
            },
            {
                x:a.x,
                y:a.y
            }
        );


    let normal=
        collision.axis;


    if(
        dot(
            centerDirection,
            normal
        )<0
    ){

        normal=
            mul(
                normal,
                -1
            );
    }


    /*
        PUSH THE BLOCKS COMPLETELY APART
    */

    const slop=0.01;

    const correctionDepth=

        Math.max(
            collision.depth-slop,
            0
        )

        *

        PHYSICS.positionPercent;


    if(correctionDepth>0){

        const totalMass=
            a.mass+b.mass;

        const aShare=
            b.mass/
            totalMass;

        const bShare=
            a.mass/
            totalMass;


        if(!a.dragging){

            a.x-=
                normal.x*
                correctionDepth*
                aShare;

            a.y-=
                normal.y*
                correctionDepth*
                aShare;
        }


        if(!b.dragging){

            b.x+=
                normal.x*
                correctionDepth*
                bShare;

            b.y+=
                normal.y*
                correctionDepth*
                bShare;
        }
    }


    /*
        BOUNCE
    */

    const relativeVelocity={

        x:b.vx-a.vx,

        y:b.vy-a.vy

    };


    const velocityAlongNormal=

        dot(
            relativeVelocity,
            normal
        );


    if(
        velocityAlongNormal>0
    ){

        return;
    }


    const impulseMagnitude=

        -(1+
            PHYSICS.restitution)
        *
        velocityAlongNormal
        /
        (
            1/a.mass+
            1/b.mass
        );


    const impulse=
        mul(
            normal,
            impulseMagnitude
        );


    if(!a.dragging){

        a.vx-=
            impulse.x/a.mass;

        a.vy-=
            impulse.y/a.mass;
    }


    if(!b.dragging){

        b.vx+=
            impulse.x/b.mass;

        b.vy+=
            impulse.y/b.mass;
    }


    /*
        FRICTION
    */

    const tangent={

        x:-normal.y,

        y:normal.x

    };


    const tangentVelocity=

        dot(
            relativeVelocity,
            tangent
        );


    const frictionImpulse=

        tangentVelocity*
        PHYSICS.friction;


    if(!a.dragging){

        a.vx+=
            tangent.x*
            frictionImpulse;

        a.vy+=
            tangent.y*
            frictionImpulse;
    }


    if(!b.dragging){

        b.vx-=
            tangent.x*
            frictionImpulse;

        b.vy-=
            tangent.y*
            frictionImpulse;
    }
}


/* ============================================================
   SOLID COLLISION SOLVER
============================================================ */

function solveAllCollisions(){

    for(
        let iteration=0;

        iteration<
        PHYSICS.collisionIterations;

        iteration++
    ){

        let foundCollision=false;


        for(
            let i=0;
            i<objects.length;
            i++
        ){

            const a=
                objects[i];


            if(a.dragging){
                continue;
            }


            for(
                let j=i+1;
                j<objects.length;
                j++
            ){

                const b=
                    objects[j];


                if(b.dragging){
                    continue;
                }


                const polyA=
                    roundedPolygon(a);

                const polyB=
                    roundedPolygon(b);


                const collision=
                    polygonCollision(
                        polyA,
                        polyB
                    );


                if(collision){

                    foundCollision=true;


                    resolveCollision(
                        a,
                        b,
                        collision
                    );
                }
            }
        }


        if(!foundCollision){
            break;
        }
    }
}


/* ============================================================
   SCREEN EDGES
============================================================ */

function keepInside(obj){

    if(obj.dragging){
        return;
    }


    const poly=
        roundedPolygon(obj);


    let minX=Infinity;
    let maxX=-Infinity;

    let minY=Infinity;
    let maxY=-Infinity;


    for(const p of poly){

        minX=
            Math.min(
                minX,
                p.x
            );

        maxX=
            Math.max(
                maxX,
                p.x
            );

        minY=
            Math.min(
                minY,
                p.y
            );

        maxY=
            Math.max(
                maxY,
                p.y
            );
    }


    if(minX<0){

        obj.x-=minX;

        if(obj.vx<0){

            obj.vx=
                -obj.vx*
                PHYSICS.restitution;
        }
    }


    if(maxX>innerWidth){

        obj.x-=
            maxX-innerWidth;

        if(obj.vx>0){

            obj.vx=
                -obj.vx*
                PHYSICS.restitution;
        }
    }


    if(minY<0){

        obj.y-=minY;

        if(obj.vy<0){

            obj.vy=
                -obj.vy*
                PHYSICS.restitution;
        }
    }


    if(maxY>innerHeight){

        obj.y-=
            maxY-innerHeight;

        if(obj.vy>0){

            obj.vy=
                -obj.vy*
                PHYSICS.restitution;
        }
    }
}


/* ============================================================
   SPEED
============================================================ */

function limitVelocity(obj){

    const speed=
        Math.hypot(
            obj.vx,
            obj.vy
        );


    if(
        speed>
        PHYSICS.maxSpeed
    ){

        const scale=
            PHYSICS.maxSpeed/
            speed;

        obj.vx*=scale;
        obj.vy*=scale;
    }


    if(
        Math.abs(
            obj.angularVelocity
        )>
        PHYSICS.maxAngular
    ){

        obj.angularVelocity=

            Math.sign(
                obj.angularVelocity
            )
            *
            PHYSICS.maxAngular;
    }
}


/* ============================================================
   SPACE FLOAT
============================================================ */

function keepFloating(
    obj,
    time
){

    if(obj.dragging){
        return;
    }


    const fx=

        Math.sin(
            time*.00025+
            obj.x*.002
        )
        *
        .0015;


    const fy=

        Math.cos(
            time*.00021+
            obj.y*.002
        )
        *
        .0015;


    obj.vx+=fx;
    obj.vy+=fy;


    const speed=
        Math.hypot(
            obj.vx,
            obj.vy
        );


    if(
        speed<
        PHYSICS.minimumSpeed
    ){

        const angle=

            Math.atan2(
                obj.y,
                obj.x
            )
            +
            Math.PI/2;


        obj.vx+=
            Math.cos(angle)*
            PHYSICS.minimumSpeed;

        obj.vy+=
            Math.sin(angle)*
            PHYSICS.minimumSpeed;
    }
}


/* ============================================================
   DRAGGING
============================================================ */

function setupDragging(obj){

    const el=obj.el;

    let downX=0;
    let downY=0;

    let startX=0;
    let startY=0;


    el.addEventListener(
        "pointerdown",
        e=>{

            if(
                e.button!==undefined &&
                e.button!==0
            ){
                return;
            }


            e.preventDefault();


            obj.dragging=true;

            obj.pointerId=
                e.pointerId;


            el.setPointerCapture(
                e.pointerId
            );


            downX=e.clientX;
            downY=e.clientY;


            startX=obj.x;
            startY=obj.y;


            obj.previousX=obj.x;
            obj.previousY=obj.y;


            obj.vx=0;
            obj.vy=0;


            obj.moved=false;


            el.classList.add(
                "dragging"
            );
        }
    );


    el.addEventListener(
        "pointermove",
        e=>{

            if(
                !obj.dragging ||
                e.pointerId!==obj.pointerId
            ){
                return;
            }


            const dx=
                e.clientX-downX;

            const dy=
                e.clientY-downY;


            if(
                Math.abs(dx)>4 ||
                Math.abs(dy)>4
            ){

                obj.moved=true;
            }


            obj.x=
                startX+dx;

            obj.y=
                startY+dy;


            const poly=
                roundedPolygon(obj);


            let minX=Infinity;
            let maxX=-Infinity;

            let minY=Infinity;
            let maxY=-Infinity;


            for(const p of poly){

                minX=
                    Math.min(
                        minX,
                        p.x
                    );

                maxX=
                    Math.max(
                        maxX,
                        p.x
                    );

                minY=
                    Math.min(
                        minY,
                        p.y
                    );

                maxY=
                    Math.max(
                        maxY,
                        p.y
                    );
            }


            if(minX<0)
                obj.x-=minX;


            if(maxX>innerWidth)
                obj.x-=
                    maxX-innerWidth;


            if(minY<0)
                obj.y-=minY;


            if(maxY>innerHeight)
                obj.y-=
                    maxY-innerHeight;

        }
    );


    function release(e){

        if(
            !obj.dragging ||
            e.pointerId!==obj.pointerId
        ){
            return;
        }


        obj.dragging=false;


        try{

            el.releasePointerCapture(
                e.pointerId
            );

        }catch(_){}


        el.classList.remove(
            "dragging"
        );


        const dx=
            obj.x-
            obj.previousX;

        const dy=
            obj.y-
            obj.previousY;


        obj.vx=
            dx*.22;

        obj.vy=
            dy*.22;


        obj.vx=
            Math.max(
                -PHYSICS.maxSpeed,
                Math.min(
                    PHYSICS.maxSpeed,
                    obj.vx
                )
            );


        obj.vy=
            Math.max(
                -PHYSICS.maxSpeed,
                Math.min(
                    PHYSICS.maxSpeed,
                    obj.vy
                )
            );


        if(!obj.moved){

            openBrowser(
                obj.el.dataset.url
            );
        }


        obj.pointerId=null;
    }


    el.addEventListener(
        "pointerup",
        release
    );


    el.addEventListener(
        "pointercancel",
        release
    );
}


/* ============================================================
   RENDER
============================================================ */

function render(obj){

    obj.el.style.transform=

        `translate3d(
            ${obj.x-obj.width/2}px,
            ${obj.y-obj.height/2}px,
            0
        )
        rotate(${obj.angle}rad)`;
}


/* ============================================================
   MAIN LOOP
============================================================ */

let lastTime=
    performance.now();


function physicsLoop(time){

    let dt=
        (time-lastTime)/
        16.6667;


    lastTime=time;


    dt=
        Math.min(
            dt,
            2
        );


    for(
        const obj of objects
    ){

        if(obj.dragging){

            render(obj);

            continue;
        }


        obj.previousX=
            obj.x;

        obj.previousY=
            obj.y;


        obj.vy+=
            PHYSICS.gravity*
            dt;


        obj.vx*=
            Math.pow(
                PHYSICS.air,
                dt
            );


        obj.vy*=
            Math.pow(
                PHYSICS.air,
                dt
            );


        obj.angularVelocity*=
            Math.pow(
                PHYSICS.angularAir,
                dt
            );


        obj.x+=
            obj.vx*dt;

        obj.y+=
            obj.vy*dt;


        obj.angle+=
            obj.angularVelocity*
            dt;


        keepFloating(
            obj,
            time
        );


        limitVelocity(obj);

        keepInside(obj);
    }


    /*
        HARD SOLID COLLISION PASS
    */

    solveAllCollisions();


    /*
        Final edge correction
    */

    for(
        const obj of objects
    ){

        keepInside(obj);

        render(obj);
    }


    requestAnimationFrame(
        physicsLoop
    );
}


requestAnimationFrame(
    physicsLoop
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    ()=>{

        for(
            const obj of objects
        ){

            obj.width=
                obj.el.offsetWidth;

            obj.height=
                obj.el.offsetHeight;

            obj.radius=
                getRadius(obj.el);

            keepInside(obj);
        }


        solveAllCollisions();


        for(
            const obj of objects
        ){

            render(obj);
        }
    }
);


/* ============================================================
   URL / SEARCH
============================================================ */

function getDestination(value){

    value=
        value.trim();


    if(!value){
        return null;
    }


    const localPages=[

        "games.html",
        "movies.html",
        "roblox.html",
        "index.html"

    ];


    if(
        localPages.includes(
            value.toLowerCase()
        )
    ){

        return value;
    }


    if(
        /^https?:\/\//i
            .test(value)
    ){

        return value;
    }


    if(
        /^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i
            .test(value)
    ){

        return "https://"+value;
    }


    return
        "https://www.google.com/search?q="+
        encodeURIComponent(value);
}


/* ============================================================
   OPEN BROWSER
============================================================ */

function openBrowser(url){

    if(!url){
        return;
    }


    browserFrame.src=url;

    browserAddress.value=url;

    browser.classList.add(
        "open"
    );
}


/* ============================================================
   CLOSE BROWSER
============================================================ */

function closeBrowserWindow(){

    browser.classList.remove(
        "open"
    );


    browserFrame.src=
        "about:blank";

    browserAddress.value="";
}


closeBrowser.addEventListener(
    "click",
    closeBrowserWindow
);


/* ============================================================
   SEARCH
============================================================ */

searchForm.addEventListener(
    "submit",
    e=>{

        e.preventDefault();


        const destination=
            getDestination(
                searchInput.value
            );


        if(destination){

            openBrowser(
                destination
            );

            searchInput.blur();
        }
    }
);


/* ============================================================
   ENTER
============================================================ */

searchInput.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            e.preventDefault();

            searchForm.requestSubmit();
        }
    }
);


/* ============================================================
   ESCAPE
============================================================ */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="Escape" &&
            browser.classList.contains(
                "open"
            )
        ){

            closeBrowserWindow();
        }
    }
);


/* ============================================================
   BROWSER NAVIGATION
============================================================ */

backButton.addEventListener(
    "click",
    ()=>{

        try{

            browserFrame
                .contentWindow
                .history
                .back();

        }catch(_){}
    }
);


forwardButton.addEventListener(
    "click",
    ()=>{

        try{

            browserFrame
                .contentWindow
                .history
                .forward();

        }catch(_){}
    }
);


/* ============================================================
   INITIAL RENDER
============================================================ */

for(
    const obj of objects
){

    render(obj);
}

</script>
